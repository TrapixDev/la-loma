; Ejemplo de config.ini por PC.
; Copie este archivo a  %APPDATA%\PosLaLoma\config.ini  (modo .exe)
; o junto al proyecto como  config.ini  (modo fuente) y ajuste los valores.

[pos]
; --- En el SERVIDOR (PC que guarda la base): no ponga server_url ---
station = CAJA1
docs_path = \\NOMBRE-DE-ESTA-PC\documentos
; Puerto donde escucha el servidor (útil si el 8000 está ocupado por otro
; programa). Si se omite, se usa el puerto de server_url o 8000.
;server_port = 8000

; --- En cada CAJA (las demás PCs) ---
; Se exige HTTPS: el PIN y la sesión no deben viajar sin cifrar.
; Genere el certificado en el servidor con tools\generar_certificado.py y
; copie SOLO server-cert.pem a esta PC (nunca la clave privada).
;server_url = https://192.168.1.10:8000
;station = CAJA2
;docs_path = \\192.168.1.10\documentos
;tls_ca = C:\PosLaLoma\certs\server-cert.pem

; SOLO temporal y dentro de una red de confianza: permite HTTP sin cifrar
; (queda registrado en el log). Lo correcto es usar HTTPS.
;permitir_http = 1

; --- Modo de operación (server = normal, local = una sola PC sin red) ---
;mode = server

; --- Duración de la sesión (horas) y allowlist de red del servidor ---
;session_hours = 12
;lan_only = 0   (NO recomendado: deja de rechazar orígenes de Internet)

; --- Firma de actualizaciones (clave pública Ed25519 en base64) ---
; Se genera con tools\generar_claves_update.py y cada setup se firma con
; tools\firmar_setup.py (el servidor publica el .sig junto al .exe).
;update_public_key =

; --- En tickets cobrados en USD, mostrar equivalente en colones (0 = ocultar) ---
;mostrar_equivalente_crc = 1
